server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name www.modfans.xyz;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/www_modfans_fun;

    include /www/server/panel/vhost/nginx/well-known/www.modfans.fun.conf;

    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/www.modfans.fun/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/www.modfans.fun/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497  https://$host$request_uri;

    error_page 404 /404.html;

    include enable-php-80.conf;

    include /www/server/panel/vhost/rewrite/www.modfans.fun.conf;

    # ========== F1 Editor 配置开始 ==========
    
    # F1 Editor 主应用
    location ^~ /f1m-editor/ {
        alias /www/wwwroot/www.modfans.xyz/f1m-editor/;
        index index.html;
        try_files $uri $uri/ /f1m-editor/index.html;
    }
    
    # F1 Editor 图片资源（修复 ../assets/ 路径问题）
    location ^~ /assets/ {
        alias /www/wwwroot/www.modfans.xyz/f1m-editor/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ========== F1 Editor 配置结束 ==========

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ .well-known{
        allow all;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/www.modfans.fun.log;
    error_log  /www/wwwlogs/www.modfans.fun.error.log;
}
